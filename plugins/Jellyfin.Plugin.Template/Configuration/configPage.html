<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Template</title></head>
<body>
<div id="TemplateConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
  <div data-role="content">
    <div class="content-primary">
      <form id="TemplateConfigForm">
        <div class="inputContainer">
          <label class="inputLabel inputLabelUnfocused" for="Message">Message</label>
          <input id="Message" name="Message" type="text" is="emby-input" />
        </div>
        <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
      </form>
    </div>
  </div>
  <script type="text/javascript">
    var guid = '00ada1b1-b58d-4585-a56b-ca0b44b65077';
    document.querySelector('#TemplateConfigPage').addEventListener('pageshow', function () {
      Dashboard.showLoadingMsg();
      ApiClient.getPluginConfiguration(guid).then(function (c) {
        document.querySelector('#Message').value = c.Message;
        Dashboard.hideLoadingMsg();
      });
    });
    document.querySelector('#TemplateConfigForm').addEventListener('submit', function (e) {
      Dashboard.showLoadingMsg();
      ApiClient.getPluginConfiguration(guid).then(function (c) {
        c.Message = document.querySelector('#Message').value;
        ApiClient.updatePluginConfiguration(guid, c).then(Dashboard.processPluginConfigurationUpdateResult);
      });
      e.preventDefault();
      return false;
    });
  </script>
</div>
</body>
</html>
