<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>JellyTvOverlay</title></head>
<body>
<div id="JellyTvOverlayConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
  <div data-role="content">
    <div class="content-primary">
      <form id="JellyTvOverlayConfigForm">
        <label class="checkboxContainer">
          <input id="Enabled" name="Enabled" type="checkbox" is="emby-checkbox" />
          <span>Enabled</span>
        </label>
        <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
      </form>
    </div>
  </div>
  <script type="text/javascript">
    var guid = '9b2bf30d-ca33-43a8-b8a7-643f51573c1c';
    document.querySelector('#JellyTvOverlayConfigPage').addEventListener('pageshow', function () {
      Dashboard.showLoadingMsg();
      ApiClient.getPluginConfiguration(guid).then(function (c) {
        document.querySelector('#Enabled').checked = c.Enabled !== false;
        Dashboard.hideLoadingMsg();
      });
    });
    document.querySelector('#JellyTvOverlayConfigForm').addEventListener('submit', function (e) {
      Dashboard.showLoadingMsg();
      ApiClient.getPluginConfiguration(guid).then(function (c) {
        c.Enabled = document.querySelector('#Enabled').checked;
        ApiClient.updatePluginConfiguration(guid, c).then(Dashboard.processPluginConfigurationUpdateResult);
      });
      e.preventDefault();
      return false;
    });
  </script>
</div>
</body>
</html>
