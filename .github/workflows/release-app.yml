# Release an Android TV app by pushing a tag: app-<AppFolder>-v<version>
#   e.g. git tag app-JellyXR.TV-v1.0.0 && git push origin app-JellyXR.TV-v1.0.0
# Builds apps/<AppFolder>/build.sh, signs with the release keystore and attaches the APK to a GitHub Release.
# Needs repo secrets ANDROID_KEYSTORE_B64 (base64 of the .jks) and ANDROID_KEYSTORE_PASS.
name: Release app

on:
  push:
    tags:
      - 'app-*-v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME#app-}"
          echo "folder=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"

      - name: Keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Repo secret ANDROID_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          KEYSTORE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          bash "apps/${{ steps.tag.outputs.folder }}/build.sh"
          APK="$(ls apps/${{ steps.tag.outputs.folder }}/build/*.apk | grep -v -e unsigned -e aligned -e base | head -1)"
          OUT="${{ steps.tag.outputs.folder }}-${{ steps.tag.outputs.version }}.apk"
          cp "$APK" "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="apps/${{ steps.tag.outputs.folder }}/RELEASE_NOTES.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" "$APK" --title "${{ steps.tag.outputs.folder }} ${{ steps.tag.outputs.version }}" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "${{ steps.tag.outputs.folder }} ${{ steps.tag.outputs.version }}" --generate-notes
          fi
